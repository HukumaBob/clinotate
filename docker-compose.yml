services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-worker:
    build:
      context: ./ml-worker
    restart: unless-stopped
    volumes:
      # Persists the downloaded SAM-3 checkpoint (~3GB) and other HF cache
      # entries across container restarts -- this service now restarts
      # itself after every failed track() call (see app/tasks.py's
      # _restart_worker_process_after_track_failure), so re-downloading the
      # checkpoint on every restart would make that recovery path
      # unacceptably slow.
      - ml_worker_hf_cache:/root/.cache/huggingface
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_SECURE: "false"
      HF_TOKEN: ${HF_TOKEN}
      # PyTorch's default CUDA caching allocator reserves fixed-size
      # cudaMalloc segments, which fragments the CUDA address space under
      # SAM2's variable per-tracking-job frame count. On this GPU (RTX 2070,
      # BAR1 limited to 256 MiB, no Resizable BAR, also driving the desktop
      # display) that fragmentation has been observed to hard-hang the whole
      # host rather than raise a catchable OOM. expandable_segments uses
      # CUDA's virtual memory management API instead of fixed segments,
      # which avoids this fragmentation pattern -- see
      # docs/superpowers/specs/2026-08-08-sam2-gpu-oom-host-crash-design.md.
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    depends_on:
      - postgres
      - redis
      - minio
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  postgres_data:
  minio_data:
  ml_worker_hf_cache:
